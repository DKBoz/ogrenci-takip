<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Öğrenci Takip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F3F5F8; --surface: #FFFFFF; --ink: #1B2433; --muted: #5A6476; --line: #D9DFE7;
  --accent: #2C5A88; --accent-ink: #FFFFFF; --soft: #E7EEF6;
  --present: #2F7A57; --present-bg: #E4F2EA;
  --absent: #A65A12; --absent-bg: #FBEBDA;
  --late: #6D50A8; --late-bg: #EEE8F7;
  --excused: #2D6F8F; --excused-bg: #E2EFF5;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121821; --surface: #1A222D; --ink: #E5E9EF; --muted: #9AA5B4; --line: #2B3543;
    --accent: #86ADD8; --accent-ink: #0F1620; --soft: #223042;
    --present: #7CCBA2; --present-bg: #1C3328;
    --absent: #F0AE6C; --absent-bg: #3A2A1A;
    --late: #B9A3E6; --late-bg: #2C2540;
    --excused: #86C2DE; --excused-bg: #1C3340;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.5 "Atkinson Hyperlegible Next", system-ui, -apple-system, "Segoe UI", sans-serif;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2 { margin: 0; line-height: 1.25; }
h2 { font-size: 1.15rem; font-weight: 700; }
small { display: block; color: var(--muted); font-size: .88rem; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.logo { font-weight: 700; font-size: 1.1rem; letter-spacing: -.01em; white-space: nowrap; }
.school { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: .95rem; }
.who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40vw; }

.tabs {
  display: flex; gap: 4px; padding: 8px 20px 0; background: var(--surface);
  border-bottom: 1px solid var(--line); overflow-x: auto;
}
.tabs button {
  border: 0; background: none; padding: 10px 14px; cursor: pointer; color: var(--muted);
  border-bottom: 3px solid transparent; white-space: nowrap; font-weight: 600;
}
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

.wrap { max-width: 920px; margin: 0 auto; padding: 20px 16px 120px; display: grid; gap: 16px; }
.wrap.narrow { max-width: 520px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 14px; }
.panel.empty p { margin: 0; }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1 1 180px; }
.top-gap { margin-top: 4px; }
.muted { color: var(--muted); }
.pad { padding: 8px 4px; }
p { margin: 0; }

.field { display: grid; gap: 4px; font-size: .9rem; color: var(--muted); font-weight: 600; }
.field.inline { display: flex; align-items: center; gap: 8px; }
input, select {
  width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg); color: var(--ink); font-weight: 400; min-height: 44px;
}
.field.inline select { width: auto; }
.w-no { width: 110px; flex: 0 0 110px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 720px) { .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; font-weight: 600;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: .92rem; }
.btn.quiet { background: transparent; border-color: transparent; color: var(--muted); }
.btn:disabled { opacity: .55; cursor: progress; }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

.auth { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.auth-card { width: 100%; max-width: 400px; display: grid; gap: 16px; }
.auth-card .logo { font-size: 1.6rem; }
.auth-links { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.note { background: var(--soft); padding: 10px 12px; border-radius: 8px; }

.state { font-size: .92rem; color: var(--muted); }
.state.saved { color: var(--present); font-weight: 600; }

.unit { border: 1px solid var(--line); border-radius: 8px; }
.unit summary { padding: 10px 12px; cursor: pointer; font-weight: 600; }
.objs { list-style: none; margin: 0; padding: 0 12px 8px; display: grid; gap: 2px; }
.chk { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; padding: 8px 4px; cursor: pointer; border-radius: 6px; }
.chk input { width: 20px; height: 20px; min-height: 0; margin: 2px 0 0; accent-color: var(--accent); }

.roster { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.stu {
  width: 100%; display: grid; grid-template-columns: 3.2em 1fr auto; align-items: center; gap: 10px;
  padding: 10px 14px 10px 12px; border: 1px solid var(--line); border-left-width: 8px;
  border-radius: 8px; background: var(--surface); cursor: pointer; text-align: left; min-height: 52px;
  transition: background-color .15s, border-color .15s;
}
.stu .no { color: var(--muted); font-variant-numeric: tabular-nums; }
.stu .nm { font-weight: 600; }
.stu .st { font-weight: 700; font-size: .9rem; padding: 3px 10px; border-radius: 999px; min-width: 4.5em; text-align: center; }
.st-present { border-left-color: var(--present); }
.st-present .st { color: var(--present); background: var(--present-bg); }
.st-absent { border-left-color: var(--absent); background: var(--absent-bg); }
.st-absent .st { color: var(--absent); background: var(--surface); }
.st-late { border-left-color: var(--late); background: var(--late-bg); }
.st-late .st { color: var(--late); background: var(--surface); }
.st-excused { border-left-color: var(--excused); background: var(--excused-bg); }
.st-excused .st { color: var(--excused); background: var(--surface); }
.tally { font-weight: 600; }
.hint { font-size: .9rem; }

.savebar {
  position: sticky; bottom: 0; z-index: 5; display: flex; justify-content: flex-end; gap: 10px;
  padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, var(--bg) 35%);
}

.recent, .classes, .members, .plain { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.rec, .cls {
  width: 100%; display: grid; gap: 2px; text-align: left; padding: 10px 12px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer;
}
.rec { grid-template-columns: 1fr auto; }
.rec .muted { grid-column: 1; font-size: .9rem; }
.rec .miss { grid-column: 2; grid-row: 1 / span 2; align-self: center; font-size: .9rem; color: var(--muted); }
.rec.cur, .cls.cur { border-color: var(--accent); background: var(--soft); }
.classes { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.classes.courses { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.cls .muted { font-size: .9rem; }
.plain li { display: grid; grid-template-columns: 3.2em 1fr auto; gap: 10px; align-items: center; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.plain .no { color: var(--muted); font-variant-numeric: tabular-nums; }
.members li { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 0; border-bottom: 1px solid var(--line); }
.members select { width: auto; }
select.move { width: auto; min-height: 36px; padding: 4px 8px; font-size: .9rem; }
.plain .row { flex-wrap: nowrap; }
.code { font-size: 1.4rem; font-weight: 700; letter-spacing: .12em; padding: 6px 14px; background: var(--soft); border-radius: 8px; }

.scroll { overflow-x: auto; }
table.list { width: 100%; border-collapse: collapse; font-size: .95rem; }
.list th, .list td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.list th { color: var(--muted); font-weight: 600; }
.list input { min-height: 38px; padding: 6px 8px; }

.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 720px) { .grid3 { grid-template-columns: 1fr; } }
table.grid { border-collapse: separate; border-spacing: 0; font-size: .95rem; }
.grid th, .grid td { padding: 4px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
.grid thead th { color: var(--muted); font-weight: 600; }
.grid thead th:first-child { position: sticky; left: 0; z-index: 2; background: var(--surface); text-align: left; }
.grid tbody th { position: sticky; left: 0; z-index: 1; background: var(--surface); text-align: left; font-weight: 600; padding-right: 12px; }
.grid .no { color: var(--muted); font-weight: 400; margin-right: 6px; font-variant-numeric: tabular-nums; }
.tog { width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); cursor: pointer; font-weight: 700; color: var(--muted); }
.tog.ok { background: var(--present-bg); color: var(--present); border-color: var(--present); }
.tog.no { background: var(--absent-bg); color: var(--absent); border-color: var(--absent); }
input.pt { width: 4.6em; min-height: 40px; padding: 6px; text-align: center; }
input.pt.bad { border-color: var(--absent); outline: 2px solid var(--absent); }
.tot { font-variant-numeric: tabular-nums; font-weight: 600; padding: 0 10px !important; }
.legend { margin: 0; padding: 4px 12px 12px; list-style: none; display: grid; gap: 4px; }
.legend b { display: inline-block; min-width: 2.6em; }
table.items select { min-width: 220px; }
.an td { white-space: nowrap; font-variant-numeric: tabular-nums; }
.an th { white-space: normal; min-width: 7em; }
.an tr.open > td { background: var(--soft); }
.an .detail > td { white-space: normal; background: var(--bg); }
.an .detail table td { white-space: normal; }
.neg { color: var(--absent); font-weight: 700; }
.explain { font-size: .9rem; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--bg); padding: 10px 14px; min-height: 44px; cursor: pointer; font-weight: 600; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.student { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: start; }
@media (max-width: 760px) { .student { grid-template-columns: 1fr; } }
.s-left, .s-right { display: grid; gap: 10px; min-width: 0; }
.obj { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.otext b { font-weight: 600; }
.otext.tag-s b::after { content: "  güçlü yön"; font-size: .78rem; color: var(--present); font-weight: 600; }
.otext.tag-n b::after { content: "  sonraki adım"; font-size: .78rem; color: var(--absent); font-weight: 600; }
.pick { display: inline-flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.lv { min-width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); cursor: pointer; font-weight: 700; color: var(--muted); }
.lv[aria-pressed="true"] { color: var(--ink); border-width: 2px; }
.lv.l1[aria-pressed="true"] { background: var(--absent-bg); border-color: var(--absent); }
.lv.l2[aria-pressed="true"] { background: var(--late-bg); border-color: var(--late); }
.lv.l3[aria-pressed="true"] { background: var(--excused-bg); border-color: var(--excused); }
.lv.l4[aria-pressed="true"] { background: var(--present-bg); border-color: var(--present); }
.lv.zero[aria-pressed="true"] { background: var(--soft); border-color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: .88rem; font-weight: 600; background: var(--soft); }
.chip.l1 { background: var(--absent-bg); color: var(--absent); }
.chip.l2 { background: var(--late-bg); color: var(--late); }
.chip.l3 { background: var(--excused-bg); color: var(--excused); }
.chip.l4 { background: var(--present-bg); color: var(--present); }
.comment { background: var(--bg); border-radius: 8px; padding: 12px 14px; line-height: 1.6; }
.comment.empty { color: var(--muted); }

#toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 140%);
  background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 10px; max-width: min(92vw, 520px);
  z-index: 50; transition: transform .2s; font-weight: 600;
}
#toast.show { transform: translate(-50%, 0); }
#toast.bad { background: var(--absent); color: #fff; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app"><p class="pad muted">Yükleniyor…</p></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" integrity="sha384-vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw" crossorigin="anonymous"></script>
<script>
// ===== Ayarlar: Supabase projesinin adresi ve publishable anahtarı =====
const SUPABASE_URL = 'https://ixqeazpoerbpryrvamkr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_KnM1ZYjZZ6xsMnnyIE41IA_hwYE-wCv';
// ========================================================================

const BOOT_HASH = location.hash;
const IDLE_MINUTES = 60; // bu kadar dakika işlem yapılmazsa otomatik çıkış
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const STATUS = {
  present: { label: 'Var', next: 'absent' },
  absent: { label: 'Yok', next: 'late' },
  late: { label: 'Geç', next: 'excused' },
  excused: { label: 'İzinli', next: 'present' },
};

const S = {
  user: null, profile: null, memberships: [], schools: [], schoolId: null, role: null,
  tab: 'lessons', year: currentYear(), classes: [], courses: [], objCache: {},
  L: null, students: [], objectives: [], recent: [],
  classView: null, courseView: null, importPreview: null, coursePreview: null, authMode: 'login',
  X: null, AN: null, CM: null,
};

// ---------- Yardımcılar ----------
const app = document.getElementById('app');
const $ = (s, el = document) => el.querySelector(s);
const view = () => document.getElementById('view');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const opt = (v, l, cur) => `<option value="${esc(v)}" ${String(v) === String(cur) ? 'selected' : ''}>${esc(l)}</option>`;
const empty = msg => `<section class="panel empty"><p>${esc(msg)}</p></section>`;
const isAdmin = () => S.role === 'school_admin';
const byName = (a, b) => String(a.name).localeCompare(String(b.name), 'tr', { numeric: true });
const byNo = (a, b) => (parseInt(a.school_no, 10) || 1e9) - (parseInt(b.school_no, 10) || 1e9) || a.full_name.localeCompare(b.full_name, 'tr');

function toast(msg, bad) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { t.className = ''; }, bad ? 5000 : 2800);
}
function fail(error, where) {
  if (!error) return false;
  console.error(where, error);
  toast((where ? where + ': ' : '') + (error.message || error), true);
  return true;
}
function keep(k, v) { try { localStorage.setItem('ot_' + k, JSON.stringify(v)); } catch (e) {} }
function restore(k, d) { try { const v = localStorage.getItem('ot_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
function today() { return new Date().toLocaleDateString('sv'); }
function currentYear() {
  const d = new Date(), y = d.getFullYear();
  return d.getMonth() >= 7 ? `${y}-${y + 1}` : `${y - 1}-${y}`;
}
function fmtDate(d) {
  return new Date(d + 'T12:00:00').toLocaleDateString('tr-TR', { weekday: 'short', day: 'numeric', month: 'long' });
}
function titleCase(s) {
  return s.toLocaleLowerCase('tr').replace(/(^|[\s\-'’.])(\p{L})/gu, (m, a, b) => a + b.toLocaleUpperCase('tr'));
}
function fmtNum(n) { return Number(n).toLocaleString('tr-TR', { maximumFractionDigits: 2 }); }
async function fetchAll(make) {
  const out = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await make().range(from, from + 999);
    if (error) return { data: null, error };
    out.push(...(data || []));
    if (!data || data.length < 1000) return { data: out, error: null };
  }
}
function chunks(arr, n) { const out = []; for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n)); return out; }

// ---------- Giriş ----------
function renderAuth(mode, msg) {
  S.authMode = mode;
  const titles = { login: 'Giriş yap', signup: 'Hesap oluştur', forgot: 'Şifremi unuttum', setpass: 'Yeni şifre belirle' };
  const actions = { login: 'Giriş yap', signup: 'Hesap oluştur', forgot: 'Sıfırlama bağlantısı gönder', setpass: 'Şifreyi kaydet' };
  app.innerHTML = `<div class="auth"><div class="auth-card">
    <h1 class="logo">Öğrenci Takip</h1>
    <h2>${titles[mode]}</h2>
    ${msg ? `<p class="note">${esc(msg)}</p>` : ''}
    <form id="authForm" class="stack">
      ${mode === 'signup' || mode === 'setpass' ? `<label class="field">Ad soyad<input name="full_name" autocomplete="name" ${mode === 'signup' ? 'required' : ''}></label>` : ''}
      ${mode !== 'setpass' ? `<label class="field">E-posta<input name="email" type="email" autocomplete="email" required></label>` : ''}
      ${mode !== 'forgot' ? `<label class="field">${mode === 'setpass' ? 'Yeni şifre' : 'Şifre'}<input name="password" type="password" minlength="${mode === 'login' ? 6 : 8}" autocomplete="${mode === 'login' ? 'current-password' : 'new-password'}" required></label>` : ''}
      <button class="btn primary" type="submit">${actions[mode]}</button>
    </form>
    <div class="auth-links">
      ${mode === 'login' ? `<button class="link" data-mode="signup">Hesabın yok mu? Hesap oluştur</button><button class="link" data-mode="forgot">Şifremi unuttum</button>` : ''}
      ${mode === 'signup' || mode === 'forgot' ? `<button class="link" data-mode="login">Girişe dön</button>` : ''}
    </div>
  </div></div>`;
  app.querySelectorAll('[data-mode]').forEach(b => { b.onclick = () => renderAuth(b.dataset.mode); });
  $('#authForm').onsubmit = onAuthSubmit;
}

function loginError(e) {
  if (/invalid/i.test(e.message)) return 'E-posta veya şifre hatalı.';
  if (/confirm/i.test(e.message)) return 'E-posta adresin henüz onaylanmamış. Gelen kutundaki bağlantıya tıkla.';
  return e.message;
}

async function onAuthSubmit(e) {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target));
  const btn = e.target.querySelector('button');
  btn.disabled = true;
  const redirect = location.origin + location.pathname;
  try {
    const mode = S.authMode;
    if (mode === 'login') {
      const { data, error } = await sb.auth.signInWithPassword({ email: f.email.trim(), password: f.password });
      if (error) return renderAuth('login', loginError(error));
      markActive.last = 0;
      markActive();
      await afterLogin(data.session);
    } else if (mode === 'signup') {
      const { data, error } = await sb.auth.signUp({
        email: f.email.trim(), password: f.password,
        options: { data: { full_name: f.full_name.trim() }, emailRedirectTo: redirect },
      });
      if (error) return renderAuth('signup', error.message);
      if (data.session) await afterLogin(data.session);
      else renderAuth('login', 'Onay e-postası gönderildi. E-postandaki bağlantıya tıkladıktan sonra giriş yapabilirsin.');
    } else if (mode === 'forgot') {
      const { error } = await sb.auth.resetPasswordForEmail(f.email.trim(), { redirectTo: redirect });
      renderAuth('login', error ? error.message : 'Şifre sıfırlama bağlantısı e-postana gönderildi.');
    } else if (mode === 'setpass') {
      const { error } = await sb.auth.updateUser({ password: f.password });
      if (error) return renderAuth('setpass', error.message);
      const { data: { session } } = await sb.auth.getSession();
      if (f.full_name && f.full_name.trim()) {
        await sb.from('profiles').update({ full_name: f.full_name.trim() }).eq('id', session.user.id);
      }
      history.replaceState(null, '', location.pathname);
      await afterLogin(session);
    }
  } finally {
    if (btn.isConnected) btn.disabled = false;
  }
}

async function afterLogin(session) {
  S.user = session.user;
  const { data: prof } = await sb.from('profiles').select('*').eq('id', S.user.id).maybeSingle();
  S.profile = prof || { full_name: '', email: S.user.email };
  const { data: mem, error } = await sb.from('memberships').select('school_id, role, status').eq('user_id', S.user.id);
  if (fail(error, 'Üyelik')) return;
  S.memberships = (mem || []).filter(m => m.status !== 'removed');
  const active = S.memberships.filter(m => m.status === 'active');
  if (!active.length) { S.schools = []; return renderNoSchool(); }
  const { data: schools } = await sb.from('schools').select('id, name, join_code').in('id', active.map(m => m.school_id));
  S.schools = (schools || []).sort(byName);
  const saved = restore('school', null);
  const pick = active.find(m => m.school_id === saved) || active[0];
  await openSchool(pick.school_id);
}

function topBar(withSchool = true) {
  const active = S.memberships.filter(m => m.status === 'active');
  const school = S.schools.find(s => s.id === S.schoolId);
  let schoolPart = '';
  if (withSchool) {
    schoolPart = active.length > 1
      ? `<select id="schoolSel" aria-label="Okul">${S.schools.map(s => opt(s.id, s.name, S.schoolId)).join('')}</select>`
      : `<span class="school">${esc(school ? school.name : '')}</span>`;
  }
  return `<header class="top">
    <div class="brand"><span class="logo">Öğrenci Takip</span>${schoolPart}</div>
    <div class="who"><span>${esc(S.profile.full_name || S.user.email)}</span><button class="link" id="logout">Çıkış</button></div>
  </header>`;
}
function bindTop() {
  $('#logout').onclick = () => sb.auth.signOut();
  const ss = $('#schoolSel');
  if (ss) ss.onchange = () => openSchool(ss.value);
}

function renderNoSchool() {
  const pending = S.memberships.some(m => m.status === 'pending');
  app.innerHTML = `${topBar(false)}<main class="wrap narrow"><section class="panel">
    ${pending
      ? `<h2>Onay bekleniyor</h2><p>Okul yöneticisi katılım isteğini onayladığında okulun burada açılacak.</p><div class="row"><button class="btn" id="refresh">Yenile</button></div><p class="muted">Başka bir okula da katılmak istersen kodunu aşağıya girebilirsin.</p>`
      : `<h2>Okuluna katıl</h2><p>Okul yöneticisinden aldığın katılım kodunu gir.</p>`}
    <form id="joinForm" class="row">
      <input name="code" class="grow" placeholder="Katılım kodu" autocapitalize="characters" autocomplete="off" required>
      <button class="btn primary">Katıl</button>
    </form>
    ${S.profile.is_platform_admin ? `<p class="muted">Platform yöneticisisin. Yeni okulları şimdilik SQL ile açıyorsun.</p>` : ''}
  </section></main>`;
  bindTop();
  const r = $('#refresh');
  if (r) r.onclick = async () => { const { data: { session } } = await sb.auth.getSession(); afterLogin(session); };
  $('#joinForm').onsubmit = async e => {
    e.preventDefault();
    const code = new FormData(e.target).get('code');
    const { error } = await sb.rpc('join_school', { code });
    if (fail(error, 'Katılım')) return;
    toast('Katılım isteğin gönderildi.');
    const { data: { session } } = await sb.auth.getSession();
    afterLogin(session);
  };
}

// ---------- Okul ve sekmeler ----------
async function openSchool(id) {
  S.schoolId = id;
  S.role = (S.memberships.find(m => m.school_id === id) || {}).role;
  keep('school', id);
  S.objCache = {}; S.L = null; S.X = null; S.AN = null; S.CM = null; S.classView = null; S.courseView = null; S.importPreview = null; S.coursePreview = null;
  await Promise.all([loadClasses(), loadCourses()]);
  renderShell();
}
async function loadClasses() {
  const { data, error } = await sb.from('classes').select('id, name, grade, academic_year, sort').eq('school_id', S.schoolId);
  if (fail(error, 'Sınıflar')) return;
  S.classes = (data || []).sort(byName);
}
async function loadCourses() {
  const { data, error } = await sb.from('courses')
    .select('id, code, title, subject, subject_names, grade, book, note, scale, draft, active').eq('school_id', S.schoolId);
  if (fail(error, 'Dersler')) return;
  S.courses = (data || []).sort((a, b) => a.title.localeCompare(b.title, 'tr', { numeric: true }));
}
async function getObjectives(courseId) {
  if (S.objCache[courseId]) return S.objCache[courseId];
  const { data, error } = await sb.from('objectives')
    .select('id, code, unit, sort, area, label, description, example, phrases').eq('course_id', courseId).order('sort');
  if (fail(error, 'Kazanımlar')) return [];
  S.objCache[courseId] = data || [];
  return S.objCache[courseId];
}
const yearClasses = () => S.classes.filter(c => c.academic_year === S.year);

function renderShell() {
  const tabs = [['lessons', 'Ders ve yoklama'], ['exams', 'Sınavlar'], ['analysis', 'Analiz'], ['comments', 'Yorumlar'], ['classes', 'Sınıflar'], ['courses', 'Dersler']];
  if (isAdmin()) tabs.push(['school', 'Okul']);
  if (!tabs.some(t => t[0] === S.tab)) S.tab = 'lessons';
  app.innerHTML = `${topBar()}
    <nav class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" aria-selected="${S.tab === k}" data-tab="${k}">${l}</button>`).join('')}</nav>
    <main class="wrap" id="view"></main>`;
  bindTop();
  app.querySelectorAll('[data-tab]').forEach(b => {
    b.onclick = () => {
      const dirty = (S.tab === 'lessons' && S.L && S.L.dirty) || (S.tab === 'exams' && S.X && S.X.dirty);
      if (dirty && !confirm('Kaydedilmemiş değişiklikler kaybolacak. Devam edilsin mi?')) return;
      if (S.L) S.L.dirty = false;
      if (S.X) S.X.dirty = false;
      S.tab = b.dataset.tab;
      renderShell();
    };
  });
  ({ lessons: viewLessons, exams: viewExams, analysis: viewAnalysis, comments: viewComments, classes: viewClasses, courses: viewCourses, school: viewSchool })[S.tab]();
}

// ---------- Ders ve yoklama ----------
function coursesFor(classId) {
  const g = (S.classes.find(c => c.id === classId) || {}).grade;
  const act = S.courses.filter(c => c.active);
  const match = act.filter(c => g && c.grade === g);
  return match.length ? match : act;
}
function pickCourse(classId, pref) {
  const list = coursesFor(classId);
  const c = list.find(x => x.id === pref) || list[0];
  return c ? c.id : null;
}
function guard(go, revert) {
  if (S.L.dirty && !confirm('Kaydedilmemiş değişiklikler kaybolacak. Devam edilsin mi?')) { if (revert) revert(); return; }
  S.L.dirty = false;
  go();
}

async function viewLessons() {
  const cls = yearClasses();
  if (!cls.length) {
    view().innerHTML = empty(isAdmin()
      ? `${S.year} eğitim yılı için sınıf yok. Sınıflar sekmesinden e-Okul sınıf listesini yükleyin.`
      : `${S.year} eğitim yılı için sınıf yok. Okul yöneticiniz sınıf listesini yüklediğinde burada görünecek.`);
    return;
  }
  if (!S.courses.length) {
    view().innerHTML = empty(isAdmin()
      ? 'Henüz ders yok. Dersler sekmesinden rubrik dosyasını içe aktarın.'
      : 'Henüz ders yok. Okul yöneticiniz dersleri eklediğinde burada görünecek.');
    return;
  }
  if (!S.L) {
    const last = restore('lesson_' + S.schoolId, {});
    const classId = (cls.find(c => c.id === last.classId) || cls[0]).id;
    S.L = { classId, courseId: pickCourse(classId, last.courseId), date: today(), period: last.period || 1,
      lessonId: null, topic: '', objectives: new Set(), att: new Map(), dirty: false };
  }
  await loadLesson();
}

async function loadLesson() {
  const L = S.L;
  view().innerHTML = `<p class="muted pad">Yükleniyor…</p>`;
  const [st, ls, rc] = await Promise.all([
    sb.from('students').select('id, full_name, school_no').eq('class_id', L.classId).eq('active', true),
    sb.from('lessons').select('id, course_id, topic').eq('class_id', L.classId).eq('lesson_date', L.date).eq('period', L.period).maybeSingle(),
    sb.from('lessons').select('id, course_id, lesson_date, period, topic').eq('class_id', L.classId)
      .order('lesson_date', { ascending: false }).order('period', { ascending: false }).limit(8),
  ]);
  if (fail(st.error, 'Öğrenciler') || fail(ls.error, 'Ders') || fail(rc.error, 'Son dersler')) return;
  S.students = (st.data || []).sort(byNo);
  L.att = new Map(); L.objectives = new Set(); L.lessonId = null; L.topic = ''; L.dirty = false;
  if (ls.data) {
    L.lessonId = ls.data.id; L.courseId = ls.data.course_id; L.topic = ls.data.topic || '';
    const [lo, at] = await Promise.all([
      sb.from('lesson_objectives').select('objective_id').eq('lesson_id', L.lessonId),
      sb.from('attendance').select('student_id, status').eq('lesson_id', L.lessonId),
    ]);
    (lo.data || []).forEach(r => L.objectives.add(r.objective_id));
    (at.data || []).forEach(r => L.att.set(r.student_id, r.status));
  }
  S.recent = rc.data || [];
  if (S.recent.length) {
    const { data } = await sb.from('attendance').select('lesson_id, status')
      .in('lesson_id', S.recent.map(r => r.id)).neq('status', 'present');
    const cnt = {};
    (data || []).forEach(r => { cnt[r.lesson_id] = cnt[r.lesson_id] || { absent: 0, late: 0, excused: 0 }; cnt[r.lesson_id][r.status]++; });
    S.recent.forEach(r => { r.cnt = cnt[r.id] || { absent: 0, late: 0, excused: 0 }; });
  }
  S.objectives = L.courseId ? await getObjectives(L.courseId) : [];
  keep('lesson_' + S.schoolId, { classId: L.classId, courseId: L.courseId, period: L.period });
  drawLesson();
}

function groupUnits(objs) {
  const out = [];
  let cur = null;
  for (const o of objs) {
    if (!cur || cur.name !== o.unit) { cur = { name: o.unit, items: [] }; out.push(cur); }
    cur.items.push(o);
  }
  return out;
}

function stuRow(s) {
  const st = S.L.att.get(s.id) || 'present';
  return `<li><button type="button" class="stu st-${st}" data-stu="${s.id}" aria-label="${esc(s.full_name)}: ${STATUS[st].label}">
    <span class="no">${esc(s.school_no || '')}</span><span class="nm">${esc(s.full_name)}</span><span class="st">${STATUS[st].label}</span>
  </button></li>`;
}
function paintRow(btn, id) {
  const st = S.L.att.get(id) || 'present';
  const s = S.students.find(x => x.id === id);
  btn.className = 'stu st-' + st;
  btn.querySelector('.st').textContent = STATUS[st].label;
  btn.setAttribute('aria-label', `${s ? s.full_name : ''}: ${STATUS[st].label}`);
}
function updateCounts() {
  const c = $('#objCount');
  if (c) c.textContent = S.L.objectives.size ? `${S.L.objectives.size} seçili` : 'Seçim yok';
  const t = $('#tally');
  if (t) {
    const n = { present: 0, absent: 0, late: 0, excused: 0 };
    S.students.forEach(s => { n[S.L.att.get(s.id) || 'present']++; });
    t.textContent = `${n.present} var, ${n.absent} yok, ${n.late} geç, ${n.excused} izinli`;
  }
}

function recentHtml() {
  if (!S.recent.length) return '';
  return `<section class="panel"><h2>Bu sınıfın son dersleri</h2><ul class="recent">${S.recent.map(r => {
    const c = S.courses.find(x => x.id === r.course_id);
    const miss = r.cnt.absent + r.cnt.excused;
    const cur = r.lesson_date === S.L.date && Number(r.period) === Number(S.L.period);
    return `<li><button type="button" class="rec ${cur ? 'cur' : ''}" data-date="${r.lesson_date}" data-period="${r.period}">
      <span>${fmtDate(r.lesson_date)}, ${r.period}. ders</span>
      <span class="muted">${esc(c ? c.title : '')}${r.topic ? ', ' + esc(r.topic) : ''}</span>
      <span class="miss">${miss ? miss + ' devamsız' : 'Tam katılım'}</span>
    </button></li>`;
  }).join('')}</ul></section>`;
}

function drawLesson() {
  const L = S.L;
  const list = coursesFor(L.classId).slice();
  if (L.courseId && !list.some(c => c.id === L.courseId)) {
    const c = S.courses.find(x => x.id === L.courseId);
    if (c) list.unshift(c);
  }
  const units = groupUnits(S.objectives);
  view().innerHTML = `
  <section class="panel">
    <div class="grid4">
      <label class="field">Sınıf<select id="lClass">${yearClasses().map(c => opt(c.id, c.name, L.classId)).join('')}</select></label>
      <label class="field">Ders<select id="lCourse">${list.map(c => opt(c.id, c.title, L.courseId)).join('')}</select></label>
      <label class="field">Tarih<input id="lDate" type="date" value="${L.date}"></label>
      <label class="field">Ders saati<select id="lPeriod">${Array.from({ length: 10 }, (_, i) => opt(i + 1, (i + 1) + '. ders', L.period)).join('')}</select></label>
    </div>
    <p class="state ${L.lessonId ? 'saved' : ''}">${L.lessonId ? 'Bu ders kayıtlı. Değişiklik yapıp yeniden kaydedebilirsin.' : 'Bu ders için henüz kayıt yok.'}</p>
  </section>

  <section class="panel">
    <div class="head"><h2>İşlenen kazanımlar</h2><span class="muted" id="objCount"></span></div>
    ${units.length ? units.map(u => `<details class="unit" ${u.items.some(o => L.objectives.has(o.id)) ? 'open' : ''}>
      <summary>${esc(u.name || 'Ünite')} <span class="muted">(${u.items.length})</span></summary>
      <ul class="objs">${u.items.map(o => `<li><label class="chk"><input type="checkbox" data-obj="${o.id}" ${L.objectives.has(o.id) ? 'checked' : ''}>
        <span>${esc(o.label)}${o.description ? `<small>${esc(o.description)}</small>` : ''}</span></label></li>`).join('')}</ul>
    </details>`).join('') : `<p class="muted">Bu derse ait kazanım yok.</p>`}
    <label class="field">Konu veya not<input id="lTopic" value="${esc(L.topic)}" placeholder="İsteğe bağlı"></label>
  </section>

  <section class="panel">
    <div class="head"><h2>Yoklama</h2><button type="button" class="btn ghost small" id="allPresent">Hepsini var yap</button></div>
    <p class="muted tally" id="tally"></p>
    ${S.students.length
      ? `<ol class="roster" id="roster">${S.students.map(stuRow).join('')}</ol><p class="muted hint">Öğrencinin satırına dokundukça durum değişir: var, yok, geç, izinli.</p>`
      : `<p class="muted">Bu sınıfta öğrenci yok.</p>`}
  </section>

  <div class="savebar">
    ${L.lessonId ? `<button type="button" class="btn quiet" id="delLesson">Dersi sil</button>` : ''}
    <button type="button" class="btn primary" id="saveLesson">${L.lessonId ? 'Değişiklikleri kaydet' : 'Dersi kaydet'}</button>
  </div>
  ${recentHtml()}`;

  updateCounts();
  $('#lClass').onchange = e => guard(() => { L.classId = e.target.value; L.courseId = pickCourse(L.classId, L.courseId); loadLesson(); }, () => { e.target.value = L.classId; });
  $('#lDate').onchange = e => { if (!e.target.value) return; guard(() => { L.date = e.target.value; loadLesson(); }, () => { e.target.value = L.date; }); };
  $('#lPeriod').onchange = e => guard(() => { L.period = Number(e.target.value); loadLesson(); }, () => { e.target.value = L.period; });
  $('#lCourse').onchange = async e => {
    L.courseId = e.target.value;
    L.objectives = new Set();
    L.dirty = true;
    S.objectives = await getObjectives(L.courseId);
    drawLesson();
  };
  view().querySelectorAll('[data-obj]').forEach(cb => {
    cb.onchange = () => { if (cb.checked) L.objectives.add(cb.dataset.obj); else L.objectives.delete(cb.dataset.obj); L.dirty = true; updateCounts(); };
  });
  $('#lTopic').oninput = e => { L.topic = e.target.value; L.dirty = true; };
  const roster = $('#roster');
  if (roster) roster.onclick = e => {
    const b = e.target.closest('[data-stu]');
    if (!b) return;
    const id = b.dataset.stu;
    L.att.set(id, STATUS[L.att.get(id) || 'present'].next);
    L.dirty = true;
    paintRow(b, id);
    updateCounts();
  };
  $('#allPresent').onclick = () => {
    S.students.forEach(s => L.att.set(s.id, 'present'));
    L.dirty = true;
    view().querySelectorAll('[data-stu]').forEach(b => paintRow(b, b.dataset.stu));
    updateCounts();
  };
  $('#saveLesson').onclick = saveLesson;
  const del = $('#delLesson');
  if (del) del.onclick = deleteLesson;
  view().querySelectorAll('.rec').forEach(b => {
    b.onclick = () => guard(() => { L.date = b.dataset.date; L.period = Number(b.dataset.period); loadLesson(); });
  });
}

async function saveLesson() {
  const L = S.L;
  const btn = $('#saveLesson');
  btn.disabled = true;
  try {
    if (!L.courseId) { toast('Önce bir ders seç.', true); return; }
    let id = L.lessonId;
    if (id) {
      const { error } = await sb.from('lessons').update({ course_id: L.courseId, topic: L.topic.trim() }).eq('id', id);
      if (fail(error, 'Ders kaydedilemedi')) return;
    } else {
      const { data, error } = await sb.from('lessons').insert({
        school_id: S.schoolId, class_id: L.classId, course_id: L.courseId,
        lesson_date: L.date, period: Number(L.period), topic: L.topic.trim(),
      }).select('id').single();
      if (error && error.code === '23505') { toast('Bu sınıf için bu saatte başka bir ders kaydı var. Sayfayı yenile.', true); return; }
      if (fail(error, 'Ders kaydedilemedi')) return;
      id = data.id;
    }
    const del = await sb.from('lesson_objectives').delete().eq('lesson_id', id);
    if (fail(del.error, 'Kazanımlar')) return;
    if (L.objectives.size) {
      const { error } = await sb.from('lesson_objectives')
        .insert([...L.objectives].map(o => ({ lesson_id: id, objective_id: o, school_id: S.schoolId })));
      if (fail(error, 'Kazanımlar')) return;
    }
    if (S.students.length) {
      const { error } = await sb.from('attendance').upsert(
        S.students.map(s => ({ lesson_id: id, student_id: s.id, school_id: S.schoolId, status: L.att.get(s.id) || 'present' })),
        { onConflict: 'lesson_id,student_id' });
      if (fail(error, 'Yoklama')) return;
    }
    L.dirty = false;
    toast('Ders kaydedildi.');
    await loadLesson();
  } finally {
    const b = $('#saveLesson');
    if (b) b.disabled = false;
  }
}

async function deleteLesson() {
  if (!confirm('Bu ders kaydı ve yoklaması silinsin mi?')) return;
  const { error } = await sb.from('lessons').delete().eq('id', S.L.lessonId);
  if (fail(error, 'Ders silinemedi')) return;
  toast('Ders silindi.');
  await loadLesson();
}

// ---------- Sınıflar ----------
async function viewClasses() {
  const years = [...new Set([currentYear(), S.year, ...S.classes.map(c => c.academic_year)])].sort().reverse();
  const cls = yearClasses();
  const counts = {};
  await Promise.all(cls.map(async c => {
    const { count } = await sb.from('students').select('id', { count: 'exact', head: true }).eq('class_id', c.id).eq('active', true);
    counts[c.id] = count || 0;
  }));
  view().innerHTML = `<section class="panel">
    <div class="head"><h2>Sınıflar</h2>
      <label class="field inline">Eğitim yılı<select id="yearSel">${years.map(y => opt(y, y, S.year)).join('')}</select></label></div>
    ${cls.length
      ? `<ul class="classes">${cls.map(c => `<li><button type="button" class="cls ${S.classView === c.id ? 'cur' : ''}" data-cls="${c.id}"><b>${esc(c.name)}</b><span class="muted">${counts[c.id]} öğrenci</span></button></li>`).join('')}</ul>`
      : `<p class="muted">${S.year} için sınıf yok.</p>`}
    ${isAdmin() ? `<div class="row top-gap">
      <button type="button" class="btn" id="eokulBtn">e-Okul sınıf listesi yükle</button>
      <input type="file" id="eokulIn" accept=".xls,.xlsx" hidden>
      <span class="muted">Dosya tarayıcında okunur, yalnızca okul no, ad soyad ve sınıf kaydedilir.</span></div>` : ''}
  </section>
  <div id="importBox"></div>
  <div id="classBox"></div>`;

  $('#yearSel').onchange = e => { S.year = e.target.value; S.classView = null; S.L = null; viewClasses(); };
  view().querySelectorAll('[data-cls]').forEach(b => {
    b.onclick = () => {
      S.classView = b.dataset.cls;
      view().querySelectorAll('[data-cls]').forEach(x => x.classList.toggle('cur', x === b));
      showClass(S.classView);
    };
  });
  if (isAdmin()) {
    $('#eokulBtn').onclick = () => $('#eokulIn').click();
    $('#eokulIn').onchange = async e => {
      const file = e.target.files[0];
      e.target.value = '';
      if (!file) return;
      try {
        const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
        const groups = parseEokul(wb);
        if (!groups.length) { toast('Dosyada "Ad Soyad" ve "No" sütunları bulunamadı.', true); return; }
        S.importPreview = groups;

function classKey(s) {
  return String(s).toLocaleUpperCase('tr').replace(/[^0-9A-ZÇĞİÖŞÜ]/g, '');

function normClass(s) {
  const raw = String(s).replace(/[^\p{L}\p{N}\s\-\/.]/gu, ' ').replace(/\s+/g, ' ').trim();
  const m = raw.toLocaleUpperCase('tr').match(/^(\d{1,2})\s*[-./ ]?\s*([A-ZÇĞİÖŞÜ])$/);
  return m ? `${m[1]}-${m[2]}` : raw;
}
function guessGrade(name) {
  const m = name.match(/^(\d{1,2})/);
  if (m) return m[1];
  return /ANA|YAŞ/.test(name.toLocaleUpperCase('tr')) ? 'ana' : '';
}

function parseEokul(wb) {
  const up = v => String(v ?? '').toLocaleUpperCase('tr').replace(/\s+/g, ' ').trim();
  const groups = new Map();
  for (const sn of wb.SheetNames) {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, defval: '', raw: false });
    let h = -1, cName = -1, cNo = -1, cCls = -1, titleClass = '';
    for (let i = 0; i < Math.min(rows.length, 50); i++) {
      const r = rows[i].map(up);
      if (!titleClass) {
        const joined = r.join(' ');
        const t = joined.match(/(\d{1,2})\s*\.?\s*SINIF\s*\/?\s*([A-ZÇĞİÖŞÜ])\s*ŞUBE/);
        if (t) titleClass = `${t[1]}-${t[2]}`;
      }
      const n = r.findIndex(v => v.includes('SOYAD'));
      if (n < 0) continue;
      h = i; cName = n;
      cNo = r.findIndex(v => ['NO', 'NO.', 'OKUL NO', 'ÖĞRENCİ NO', 'NUMARA', 'NUMARASI'].includes(v));
      cCls = r.findIndex(v => ['SINIF', 'ŞUBE', 'SINIF/ŞUBE', 'SINIFI', 'SINIF ŞUBE'].includes(v));
      break;
    }
    if (h < 0 || cNo < 0) continue;
    for (const row of rows.slice(h + 1)) {
      const name = String(row[cName] ?? '').replace(/\s+/g, ' ').trim();
      const no = String(row[cNo] ?? '').trim();
      if (!name || !/^\d+$/.test(no)) continue;
      const fromCol = cCls >= 0 ? String(row[cCls] ?? '').trim() : '';
      const cls = normClass(fromCol || titleClass || sn);
      const key = classKey(cls);
      if (!groups.has(key)) {
        const existing = yearClasses().find(c => classKey(c.name) === key);
        groups.set(key, { name: existing ? existing.name : cls, grade: existing ? existing.grade : guessGrade(cls), students: [] });
      }
      groups.get(key).students.push({ no, name: titleCase(name) });
    }
  }
  return [...groups.values()].sort(byName);
}

async function doImport() {
  const btn = $('#doImport');
  btn.disabled = true;
  try {
    const merged = new Map();
    for (const x of S.importPreview) {
      if (!x.name) { toast('Boş sınıf adı var.', true); return; }
      const key = classKey(x.name);
      const existing = yearClasses().find(c => classKey(c.name) === key);
      const name = existing ? existing.name : x.name;
      if (!merged.has(key)) merged.set(key, { name, grade: x.grade, students: [] });
      merged.get(key).students.push(...x.students);
    }
    const groups = [...merged.values()];
    const { data: cls, error } = await sb.from('classes')
      .upsert(groups.map(x => ({ school_id: S.schoolId, academic_year: S.year, name: x.name, grade: x.grade })),
        { onConflict: 'school_id,academic_year,name' })
      .select('id, name');
    if (fail(error, 'Sınıflar')) return;
    const idOf = Object.fromEntries(cls.map(c => [c.name, c.id]));
    const byNoMap = new Map();
    groups.forEach(x => x.students.forEach(s => byNoMap.set(s.no, {
      school_id: S.schoolId, class_id: idOf[x.name], school_no: s.no, full_name: s.name, active: true,
    })));
    const rows = [...byNoMap.values()];
    for (const part of chunks(rows, 500)) {
      const { error: e2 } = await sb.from('students').upsert(part, { onConflict: 'school_id,school_no' });
      if (fail(e2, 'Öğrenciler')) return;
    }
    for (const c of cls) {
      const { data } = await sb.from('students').select('id, school_no').eq('class_id', c.id).eq('active', true);
      const gone = (data || []).filter(s => s.school_no && !byNoMap.has(s.school_no)).map(s => s.id);
      if (gone.length) await sb.from('students').update({ active: false }).in('id', gone);

    S.importPreview = null;

    await loadClasses();
    viewClasses();
  } finally {
    if (btn.isConnected) btn.disabled = false;
  }
}

function parseCSV(text) {
  const rows = [];
  let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
    else if (c !== '\r') f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows;
}

function parseRubricFile(text, name) {
  text = text.replace(/^\uFEFF/, '');
  let items;
  if (/\.json$/i.test(name) || /^\s*[\[{]/.test(text)) {
    const j = JSON.parse(text);
    const arr = Array.isArray(j) ? j : [j];
    items = arr.map(x => (x && x.units)
      ? { code: x.code || x.id || '', data: x }
      : { code: (x && x.id) || '', data: typeof x.data === 'string' ? JSON.parse(x.data) : x.data });
  } else {
    const rows = parseCSV(text);
    const hdr = rows[0].map(h => h.trim().toLowerCase());
    const ci = hdr.indexOf('id'), di = hdr.indexOf('data');
    if (di < 0) throw new Error('"data" sütunu bulunamadı');
    items = rows.slice(1).filter(r => r[di]).map(r => ({ code: ci >= 0 ? r[ci].trim() : '', data: JSON.parse(r[di]) }));
  }
  return items.filter(x => x.data && Array.isArray(x.data.units));
}

// Dosyadan sınav (Cambridge One RTF)
function rtfLines(src) {
  src = src.replace(/\{\\pict[^{}]*\}/g, '');
  const lines = [];
  const stack = [];
  const SKIP = new Set(['header', 'footer', 'headerl', 'headerr', 'footerl', 'footerr', 'fonttbl', 'colortbl', 'stylesheet', 'info', 'pict', 'listtable', 'listoverridetable', 'themedata', 'datastore']);
  let runs = [], buf = '', skipNext = 0;
  let st = { b: false, i: false, ul: false, skip: false };
  const flush = () => { if (buf) { if (!st.skip) runs.push({ t: buf, b: st.b, i: st.i, ul: st.ul }); buf = ''; } };
  const endLine = () => { flush(); lines.push(runs); runs = []; };
  let i = 0;
  while (i < src.length) {
    const c = src[i];
    if (c === '{') { flush(); stack.push({ ...st }); i++; continue; }
    if (c === '}') { flush(); st = stack.pop() || st; i++; continue; }
    if (c === '\r' || c === '\n') { i++; continue; }
    if (c === '\\') {
      const n = src[i + 1];
      if (n === '\\' || n === '{' || n === '}') { if (skipNext) skipNext--; else buf += n; i += 2; continue; }
      if (n === "'") {
        if (skipNext) skipNext--; else buf += String.fromCharCode(parseInt(src.substr(i + 2, 2), 16));
        i += 4; continue;
      }
      if (n === '*') { st.skip = true; i += 2; continue; }
      const m = /^\\([a-zA-Z]+)(-?\d+)? ?/.exec(src.slice(i, i + 40));
      if (!m) { i += 2; continue; }
      i += m[0].length;
      const w = m[1], p = m[2];
      if (w === 'par' || w === 'line' || w === 'sect' || w === 'page') endLine();
      else if (w === 'tab') buf += ' ';
      else if (w === 'b') { flush(); st.b = p !== '0'; }
      else if (w === 'i') { flush(); st.i = p !== '0'; }
      else if (w === 'ul') { flush(); st.ul = p !== '0'; }
      else if (w === 'ulnone') { flush(); st.ul = false; }
      else if (w === 'plain') { flush(); st.b = false; st.i = false; st.ul = false; }
      else if (w === 'u') {
        const code = Number(p);
        buf += code === 160 ? ' ' : String.fromCharCode(code < 0 ? code + 65536 : code);
        skipNext = 1;
      } else if (SKIP.has(w)) { flush(); st.skip = true; }
      continue;
    }
    if (skipNext) { skipNext--; i++; continue; }
    buf += c; i++;
  }
  endLine();
  return lines.map(r => ({ runs: r, text: r.map(x => x.t).join('').replace(/\s+/g, ' ').trim() })).filter(l => l.text);
}

const NUM_WORDS = { one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10 };
function parseTestRtf(src) {
  const lines = rtfLines(src);
  const exs = [];
  let section = '', ex = null, item = null;
  const allBold = l => l.runs.filter(r => r.t.trim()).every(r => r.b);
  for (const l of lines) {
    if (allBold(l) && l.runs.some(r => r.ul) && !/^\d/.test(l.text) && l.text.length < 40) {
      section = l.text; ex = null; item = null; continue;
    }
    const hm = l.text.match(/^(\d+)\.\s+(.+)$/);
    if (allBold(l) && hm) {
      const pm = l.text.match(/\((one|two|three|four|five|six|seven|eight|nine|ten|\d+)\s+(?:points?|marks?)\s+each\)/i);
      const pts = pm ? (NUM_WORDS[pm[1].toLowerCase()] || Number(pm[1])) : 1;
      ex = { no: Number(hm[1]), section, title: hm[2].replace(/\s*\([^)]*each\)\s*$/i, '').trim(), points: pts, items: [], text: '' };
      exs.push(ex); item = null; continue;
    }
    if (!ex) continue;
    ex.text += ' ' + l.text;
    const first = l.runs.find(r => r.t.trim());
    const lm = first && !first.b && l.text.match(/^(\d+)\.(\s|$)/);
    if (lm) { item = { n: Number(lm[1]), example: false }; ex.items.push(item); }
    for (const r of l.runs) {
      if (!lm && r.b && /^\s*\d+\s*$/.test(r.t)) { item = { n: Number(r.t.trim()), example: false }; ex.items.push(item); continue; }
      if (r.i && r.t.trim() && item) item.example = true;
    }
  }
  return exs.map(e => {
    let items = e.items.filter((x, k, a) => a.findIndex(y => y.n === x.n) === k);
    if (items.length && items.every(x => x.example)) items = items.map(x => ({ ...x, example: false }));
    const scored = items.filter(x => !x.example);
    return { ...e, items, count: scored.length, objective_id: '' };
  });
}

const SECTION_AREAS = {
  vocabulary: ['Kelime'], grammar: ['Dil yapısı'], 'use of english': ['Dil yapısı'],
  listening: ['Dinleme', 'Okuma-Dinleme'], reading: ['Okuma', 'Okuma-Dinleme'],
  writing: ['Yazma'], speaking: ['Konuşma', 'İletişim'],
};
const MATCH_STOP = new Set(('the and a an to of in at on for you your with then look write read listen complete sentence words word using use about this that ' +
  'is are it i my me circle picture point each one two three four five answer question match choose correct tick draw colour color say ask ' +
  'fill gap missing letter order put number').split(' '));
function matchTokens(s) {
  return String(s || '').toLowerCase().replace(/[^a-zçğıöşü' ]+/g, ' ').split(/\s+/)
    .map(w => w.replace(/'s$/, '').replace(/(ing|es|s)$/, ''))
    .filter(w => w.length > 2 && !MATCH_STOP.has(w));
}
function suggestObjective(ex, unitObjs) {
  if (!unitObjs.length) return '';
  const areas = SECTION_AREAS[(ex.section || '').toLowerCase()] || [];
  const inArea = unitObjs.filter(o => areas.includes(o.area));
  const cands = inArea.length ? inArea : unitObjs;
  const exT = new Set(matchTokens(ex.title + ' ' + ex.text));
  let best = null, bestScore = 0;
  for (const o of cands) {
    let sc = 0;
    new Set(matchTokens(o.label + ' ' + o.example)).forEach(w => { if (exT.has(w)) sc++; });
    if (sc > bestScore) { best = o; bestScore = sc; }
  }
  if (best) return best.id;
  return inArea.length ? inArea[0].id : '';
}

async function startImportExam(file) {
  try {
    const src = await file.text();
    if (!/^\s*\{\\rtf/.test(src)) { toast('Bu bir RTF dosyası değil.', true); return; }
    const exs = parseTestRtf(src);
    if (!exs.length) { toast('Dosyada numaralı bölüm bulunamadı. Soruları elle girmek için "Yeni sınav oluştur"u kullan.', true); return; }
    const base = file.name.replace(/\.rtf$/i, '');
    const um = base.match(/unit[\s_-]*(?:test[\s_-]*)?(\d+)/i);
    const last = restore('examCourse_' + S.schoolId, null);
    const course = S.courses.find(c => c.id === last && c.active) || S.courses.find(c => c.active) || S.courses[0];
    S.X = {
      mode: 'import', fileName: file.name, exs, courseId: course.id, unit: null, unitNo: um ? um[1] : null,
      title: base.replace(/_/g, ' ').replace(/\bwith(out)?\s+answers\b/i, '').replace(/\s+/g, ' ').trim(),
      kind: 'test', needMatch: true, answerVersion: /with[\s_-]*answers/i.test(base) && !/without/i.test(base), dirty: true,
    };
    drawImportExam();
  } catch (err) {
    toast('Dosya okunamadı: ' + err.message, true);
  }
}

        <td><input type="number" class="pt" min="0.5" step="0.5" data-ei="${i}" data-k="points" value="${e.points}" aria-label="${e.no}. bölümde soru başına puan"></td>

async function saveImportExam() {
  const X = S.X;
  if (!X.title.trim()) { toast('Sınava bir başlık ver.', true); return; }
  const used = X.exs.filter(e => Number(e.count) > 0);
  if (!used.length) { toast('Puanlanacak soru yok.', true); return; }
  const missing = used.find(e => !e.objective_id);
  if (missing) { toast(`${missing.no}. bölüm için bir kazanım seç.`, true); return; }
  if (used.some(e => !(Number(e.points) > 0))) { toast('Soru puanları sıfırdan büyük olmalı.', true); return; }
  const items = [];
  used.forEach(e => {
    const nums = e.items.filter(x => !x.example).map(x => x.n);
    let next = Math.max(0, ...e.items.map(x => x.n));
    for (let k = 0; k < Number(e.count); k++) {
      const n = k < nums.length ? nums[k] : ++next;
      items.push({ objective_id: e.objective_id, max_points: Number(e.points), label: `${e.no}.${n}` });
    }
  });
  const btn = $('#iSave');
  btn.disabled = true;
  try {
    const { data, error } = await sb.from('assessments').insert({
      school_id: S.schoolId, course_id: X.courseId, title: X.title.trim(), kind: X.kind, source: X.fileName,
    }).select('id').single();
    if (fail(error, 'Sınav kaydedilemedi')) return;
    const { error: e2 } = await sb.from('assessment_items').insert(items.map((it, i) => ({
      school_id: S.schoolId, assessment_id: data.id, item_no: i + 1, objective_id: it.objective_id, max_points: it.max_points, label: it.label,
    })));
    if (fail(e2, 'Sorular kaydedilemedi')) return;
    keep('examCourse_' + S.schoolId, X.courseId);
    toast(`Sınav oluşturuldu: ${items.length} soru. Şimdi sonuçları girebilirsin.`);
    await openExam(data.id);
  } finally {
    const b = $('#iSave');
    if (b) b.disabled = false;
  }
}

async function saveExam() {
  const X = S.X, a = X.a;
  if (!a.title.trim()) { toast('Sınava bir başlık ver.', true); return; }
  if (!X.items.length) { toast('En az bir soru ekle.', true); return; }
  if (X.items.some(i => !i.objective_id)) { toast('Her soruya bir kazanım seç.', true); return; }
  if (X.items.some(i => !(Number(i.max_points) > 0))) { toast('Soru puanları sıfırdan büyük olmalı.', true); return; }
  const btn = $('#xSave');
  btn.disabled = true;
  try {
    let id = a.id;
    if (!id) {
      const { data, error } = await sb.from('assessments')
        .insert({ school_id: S.schoolId, course_id: a.course_id, title: a.title.trim(), kind: a.kind }).select('id').single();
      if (fail(error, 'Sınav kaydedilemedi')) return;
      id = data.id;
      const { error: e2 } = await sb.from('assessment_items').insert(X.items.map((it, i) => ({
        school_id: S.schoolId, assessment_id: id, item_no: i + 1, objective_id: it.objective_id, max_points: Number(it.max_points), label: it.label || '',
      })));
      if (fail(e2, 'Sorular kaydedilemedi')) return;
    } else {
      const { error } = await sb.from('assessments').update({ title: a.title.trim(), kind: a.kind }).eq('id', id);
      if (fail(error, 'Sınav kaydedilemedi')) return;
      if (X.removed.length) {
        const { error: e2 } = await sb.from('assessment_items').delete().in('id', X.removed);
        if (fail(e2, 'Sorular silinemedi')) return;
      }
      let next = Math.max(0, ...X.items.filter(i => i.item_no).map(i => i.item_no));
      const fresh = [];
      for (const it of X.items) {
        if (it.id) {
          const { error: e3 } = await sb.from('assessment_items')
            .update({ objective_id: it.objective_id, max_points: Number(it.max_points) }).eq('id', it.id);
          if (fail(e3, 'Sorular kaydedilemedi')) return;
        } else {
          fresh.push({ school_id: S.schoolId, assessment_id: id, item_no: ++next, objective_id: it.objective_id, max_points: Number(it.max_points) });
        }
      }
      if (fresh.length) {
        const { error: e4 } = await sb.from('assessment_items').insert(fresh);
        if (fail(e4, 'Sorular kaydedilemedi')) return;
      }
    }
    X.dirty = false;
    toast(a.id ? 'Sınav güncellendi.' : 'Sınav oluşturuldu. Şimdi sonuçları girebilirsin.');
    await openExam(id);
  } finally {
    const b = $('#xSave');
    if (b) b.disabled = false;
  }
}

// Sonuç girişi
async function loadResults() {
  const X = S.X;
  await getObjectives(X.a.course_id);
  if (!X.classId) { drawResults(); return; }
  view().innerHTML = `<p class="muted pad">Yükleniyor…</p>`;
  const [st, ac] = await Promise.all([
    sb.from('students').select('id, full_name, school_no').eq('class_id', X.classId).eq('active', true),
    sb.from('assessment_classes').select('given_on').eq('assessment_id', X.a.id).eq('class_id', X.classId).maybeSingle(),
  ]);
  if (fail(st.error, 'Öğrenciler') || fail(ac.error, 'Sınav')) return;
  X.students = (st.data || []).sort(byNo);
  X.saved = !!ac.data;
  X.givenOn = ac.data ? ac.data.given_on : today();
  X.cells = new Map();
  X.orig = new Set();
  const itemIds = X.items.map(i => i.id);
  if (itemIds.length && X.students.length) {
    const { data, error } = await fetchAll(() => sb.from('item_results').select('item_id, student_id, points')
      .in('item_id', itemIds).in('student_id', X.students.map(s => s.id)));
    if (fail(error, 'Sonuçlar')) return;
    data.forEach(r => {
      const k = r.student_id + '|' + r.item_id;
      X.cells.set(k, String(Number(r.points)));
      X.orig.add(k);
    });
  }
  X.dirty = false;
  keep('exam_' + S.schoolId, { classId: X.classId });
  drawResults();
}

function cellHtml(s, it, i) {
  const k = s.id + '|' + it.id;
  const v = S.X.cells.get(k) ?? '';
  if (Number(it.max_points) === 1) {
    const cls = v === '1' ? 'ok' : v === '0' ? 'no' : '';
    const mark = v === '1' ? '✓' : v === '0' ? '✗' : '·';
    const word = v === '1' ? 'doğru' : v === '0' ? 'yanlış' : 'boş';
    return `<td><button type="button" class="tog ${cls}" data-k="${k}" aria-label="${esc(s.full_name)}, ${esc(it.label || String(i + 1))}. soru: ${word}">${mark}</button></td>`;
  }
  return `<td><input class="pt" type="number" inputmode="decimal" min="0" max="${it.max_points}" step="0.5" data-k="${k}" value="${esc(v)}" aria-label="${esc(s.full_name)}, ${i + 1}. soru"></td>`;
}
function rowTotal(sid) {
  const X = S.X;
  let got = 0, any = false;
  const total = X.items.reduce((a, i) => a + i.max_points, 0);
  X.items.forEach(it => {
    const v = X.cells.get(sid + '|' + it.id);
    if (v !== undefined && v !== '' && !isNaN(Number(v))) { any = true; got += Number(v); }
  });
  return any ? `${fmtNum(got)}/${fmtNum(total)}` : '–';
}
function resRow(s) {
  return `<tr data-row="${s.id}">
    <th scope="row"><span class="no">${esc(s.school_no || '')}</span>${esc(s.full_name)}</th>
    ${S.X.items.map((it, i) => cellHtml(s, it, i)).join('')}
    <td class="tot" data-tot="${s.id}">${rowTotal(s.id)}</td>
    <td><button type="button" class="btn quiet small" data-fill="${s.id}">Kalanlar tam</button></td>
  </tr>`;
}

function drawResults() {
  const X = S.X, a = X.a;
  const c = S.courses.find(x => x.id === a.course_id);
  const cls = classesForCourse(a.course_id);
  const total = X.items.reduce((s, i) => s + i.max_points, 0);
  view().innerHTML = `
  <section class="panel">
    <div class="head"><h2>${esc(a.title)}</h2><button type="button" class="btn ghost small" id="rBack">Tüm sınavlar</button></div>
    <p class="muted">${KINDS[a.kind] || ''}, ${esc(c ? c.title : '')}, ${X.items.length} soru, toplam ${fmtNum(total)} puan</p>
    ${canEditExam(a) ? `<div class="row"><button type="button" class="btn small" id="rEdit">Soruları düzenle</button>
      <button type="button" class="btn quiet small" id="rDel">Sınavı sil</button></div>` : ''}
    <details class="unit"><summary>Sorular ve kazanımlar</summary>
      <ul class="legend">${X.items.map((it, i) => `<li><b>${esc(it.label || String(i + 1))}</b> ${esc(objLabel(it.objective_id))} <span class="muted">(${fmtNum(it.max_points)} puan)</span></li>`).join('')}</ul>
    </details>
  </section>
  ${!cls.length ? empty(`${S.year} eğitim yılı için sınıf yok.`) : `
  <section class="panel">
    <div class="grid3">
      <label class="field">Sınıf<select id="rClass">${cls.map(k => opt(k.id, k.name, X.classId)).join('')}</select></label>
      <label class="field">Uygulama tarihi<input id="rDate" type="date" value="${X.givenOn || today()}"></label>
    </div>
    <p class="state ${X.saved ? 'saved' : ''}">${X.saved ? 'Bu sınıfın sonuçları kayıtlı.' : 'Bu sınıf için henüz sonuç girilmedi.'}</p>
    <p class="muted hint">Tek puanlık sorularda hücreye dokundukça doğru, yanlış ve boş arasında geçiş yapılır. Sınava girmeyen öğrencinin satırını boş bırak.</p>
    ${X.students.length ? `<div class="scroll"><table class="grid" id="rGrid"><thead><tr><th>Öğrenci</th>
      ${X.items.map((it, i) => `<th title="${esc(objLabel(it.objective_id))}">${esc(it.label || String(i + 1))}</th>`).join('')}<th>Toplam</th><th></th></tr></thead>
      <tbody>${X.students.map(resRow).join('')}</tbody></table></div>` : `<p class="muted">Bu sınıfta öğrenci yok.</p>`}
  </section>
  <div class="savebar"><button type="button" class="btn primary" id="rSave">Sonuçları kaydet</button></div>`}`;

  const guardX = (go, revert) => {
    if (X.dirty && !confirm('Kaydedilmemiş sonuçlar kaybolacak. Devam edilsin mi?')) { if (revert) revert(); return; }
    X.dirty = false;
    go();
  };
  $('#rBack').onclick = () => guardX(() => { S.X = null; viewExams(); });
  const ed = $('#rEdit');
  if (ed) ed.onclick = () => guardX(() => { X.mode = 'edit'; X.removed = []; drawBuilder(); });
  const del = $('#rDel');
  if (del) del.onclick = async () => {
    if (!confirm('Bu sınav, soruları ve tüm sınıfların sonuçları silinsin mi?')) return;
    const { error } = await sb.from('assessments').delete().eq('id', a.id);
    if (fail(error, 'Sınav silinemedi')) return;
    toast('Sınav silindi.');
    S.X = null;
    viewExams();
  };
  if (!cls.length) return;
  $('#rClass').onchange = e => guardX(() => { X.classId = e.target.value; loadResults(); }, () => { e.target.value = X.classId; });
  $('#rDate').onchange = e => { X.givenOn = e.target.value; X.dirty = true; };
  $('#rSave').onclick = saveResults;
  const grid = $('#rGrid');
  if (!grid) return;
  const refreshTotal = sid => { const t = grid.querySelector(`[data-tot="${sid}"]`); if (t) t.textContent = rowTotal(sid); };
  grid.onclick = e => {
    const tog = e.target.closest('.tog');
    if (tog) {
      const k = tog.dataset.k;
      const v = X.cells.get(k) ?? '';
      const next = v === '' ? '1' : v === '1' ? '0' : '';
      X.cells.set(k, next);
      tog.className = 'tog' + (next === '1' ? ' ok' : next === '0' ? ' no' : '');
      tog.textContent = next === '1' ? '✓' : next === '0' ? '✗' : '·';
      tog.setAttribute('aria-label', tog.getAttribute('aria-label').replace(/: \S+$/, ': ' + (next === '1' ? 'doğru' : next === '0' ? 'yanlış' : 'boş')));
      X.dirty = true;
      refreshTotal(k.split('|')[0]);
      return;
    }
    const fill = e.target.closest('[data-fill]');
    if (fill) {
      const sid = fill.dataset.fill;
      X.items.forEach(it => {
        const k = sid + '|' + it.id;
        if ((X.cells.get(k) ?? '') === '') X.cells.set(k, String(it.max_points));
      });
      X.dirty = true;
      const s = X.students.find(x => x.id === sid);
      const tr = grid.querySelector(`[data-row="${sid}"]`);
      if (s && tr) tr.outerHTML = resRow(s);
    }
  };
  grid.oninput = e => {
    const inp = e.target.closest('input.pt');
    if (!inp) return;
    const k = inp.dataset.k;
    const v = inp.value.trim();
    X.cells.set(k, v);
    const max = Number(inp.max);
    inp.classList.toggle('bad', v !== '' && (isNaN(Number(v)) || Number(v) < 0 || Number(v) > max));
    X.dirty = true;
    refreshTotal(k.split('|')[0]);
  };
}

async function saveResults() {
  const X = S.X;
  const rows = [], cleared = new Map();
  for (const s of X.students) {
    for (const it of X.items) {
      const k = s.id + '|' + it.id;
      const v = (X.cells.get(k) ?? '').trim();
      if (v !== '') {
        const n = Number(v);
        if (isNaN(n) || n < 0 || n > it.max_points) {
          toast(`${s.full_name}: ${it.label || X.items.indexOf(it) + 1} numaralı soruya en fazla ${fmtNum(it.max_points)} puan verilebilir.`, true);
          return;
        }
        rows.push({ item_id: it.id, student_id: s.id, school_id: S.schoolId, points: n });
      } else if (X.orig.has(k)) {
        if (!cleared.has(s.id)) cleared.set(s.id, []);
        cleared.get(s.id).push(it.id);
      }
    }
  }
  if (!X.givenOn) { toast('Uygulama tarihini seç.', true); return; }
  const btn = $('#rSave');
  btn.disabled = true;
  try {
    const { error } = await sb.from('assessment_classes').upsert(
      { assessment_id: X.a.id, class_id: X.classId, school_id: S.schoolId, given_on: X.givenOn },
      { onConflict: 'assessment_id,class_id' });
    if (fail(error, 'Sınav tarihi')) return;
    for (const part of chunks(rows, 500)) {
      const { error: e2 } = await sb.from('item_results').upsert(part, { onConflict: 'item_id,student_id' });
      if (fail(e2, 'Sonuçlar')) return;
    }
    for (const [sid, iids] of cleared) {
      const { error: e3 } = await sb.from('item_results').delete().eq('student_id', sid).in('item_id', iids);
      if (fail(e3, 'Sonuçlar')) return;
    }
    X.dirty = false;
    toast('Sonuçlar kaydedildi.');
    await loadResults();
  } finally {
    const b = $('#rSave');
    if (b) b.disabled = false;
  }
}

// ---------- Analiz ----------
const mean = arr => arr.length ? arr.reduce((x, y) => x + y, 0) / arr.length : null;
const pctTxt = v => v == null ? '–' : Math.round(v * 100) + '%';
const gapTxt = v => v == null ? '–' : (v > 0 ? '+' : '') + String(Math.round(v * 100)).replace('-', '−');

async function viewAnalysis() {
  const cls = yearClasses();
  if (!cls.length || !S.courses.length) {
    view().innerHTML = empty('Analiz için önce sınıf listesi ve dersler eklenmeli.');
    return;
  }
  if (!S.AN || !cls.some(c => c.id === S.AN.classId)) {
    const last = restore('an_' + S.schoolId, {});
    const classId = (cls.find(c => c.id === last.classId) || cls[0]).id;
    S.AN = { classId, courseId: pickCourse(classId, last.courseId), open: null, d: null };
  }
  await loadAnalysis();
}

async function loadAnalysis() {
  const AN = S.AN;
  view().innerHTML = `<p class="muted pad">Yükleniyor…</p>`;
  if (!AN.courseId) { AN.d = null; drawAnalysis(); return; }
  const [rowsR, st, ls] = await Promise.all([
    fetchAll(() => sb.from('objective_absence_compare')
      .select('student_id, objective_id, pct, max_total, lessons_taught, lessons_missed, present_avg, present_n')
      .eq('class_id', AN.classId).eq('course_id', AN.courseId)),
    sb.from('students').select('id, full_name, school_no').eq('class_id', AN.classId).eq('active', true),
    fetchAll(() => sb.from('lessons').select('id').eq('class_id', AN.classId).eq('course_id', AN.courseId)),
  ]);
  if (fail(rowsR.error, 'Analiz') || fail(st.error, 'Öğrenciler') || fail(ls.error, 'Dersler')) return;
  const lessonIds = ls.data.map(l => l.id);
  const att = {};
  for (const part of chunks(lessonIds, 150)) {
    const { data, error } = await fetchAll(() => sb.from('attendance').select('student_id, status').in('lesson_id', part).neq('status', 'present'));
    if (fail(error, 'Yoklama')) return;
    data.forEach(r => {
      att[r.student_id] = att[r.student_id] || { absent: 0, late: 0, excused: 0 };
      att[r.student_id][r.status]++;
    });
  }
  await getObjectives(AN.courseId);
  const rows = rowsR.data.map(r => ({
    ...r, pct: Number(r.pct), present_avg: r.present_avg == null ? null : Number(r.present_avg),
    lessons_taught: Number(r.lessons_taught), lessons_missed: Number(r.lessons_missed),
  }));
  const per = (st.data || []).map(s => {
    const mine = rows.filter(r => r.student_id === s.id);
    const missed = mine.filter(r => r.lessons_missed > 0);
    const attended = mine.filter(r => r.lessons_missed === 0 && r.lessons_taught > 0);
    const peers = missed.filter(r => r.present_avg != null);
    const a = att[s.id] || { absent: 0, late: 0, excused: 0 };
    const mMiss = mean(missed.map(r => r.pct));
    const mPeers = mean(peers.map(r => r.present_avg));
    return {
      s, missed, absent: a.absent + a.excused, late: a.late,
      mMiss, mAtt: mean(attended.map(r => r.pct)), mPeers,
      gap: mMiss != null && mPeers != null ? mean(peers.map(r => r.pct)) - mPeers : null,
    };
  });
  per.sort((p, q) => {
    if (p.gap != null && q.gap != null) return p.gap - q.gap;
    if (p.gap != null) return -1;
    if (q.gap != null) return 1;
    return byNo(p.s, q.s);
  });
  AN.d = { per, lessonCount: lessonIds.length, testedObj: new Set(rows.map(r => r.objective_id)).size, rowCount: rows.length };
  keep('an_' + S.schoolId, { classId: AN.classId, courseId: AN.courseId });
  drawAnalysis();
}

function drawAnalysis() {
  const AN = S.AN, d = AN.d;
  const head = `<section class="panel">
    <div class="grid3">
      <label class="field">Sınıf<select id="aClass">${yearClasses().map(c => opt(c.id, c.name, AN.classId)).join('')}</select></label>

    </div>
    ${d ? `<p class="muted">Bu sınıfta bu derse ait ${d.lessonCount} ders kaydı var, ${d.testedObj} kazanımda sınav sonucu girilmiş.</p>` : ''}
  </section>`;
  let body;
  if (!d || !d.rowCount) {
    body = empty('Analiz için ders kayıtlarında işlenen kazanımların işaretlenmesi ve bu kazanımları ölçen sınav sonuçlarının girilmesi gerekir. Veri girildikçe tablo burada oluşur.');
  } else {
    body = `<section class="panel">
      <h2>Devamsızlık ve kazanım başarısı</h2>
      <p class="muted explain">Her öğrencinin, derse girmediği günlerde işlenen kazanımlardaki sınav başarısı, katıldığı derslerin kazanımlarındaki başarısıyla ve aynı kazanımlarda o derslere katılan sınıf arkadaşlarının ortalamasıyla karşılaştırılır. Fark sütunu, öğrencinin bu kazanımlardaki başarısının derse katılanların ortalamasından kaç yüzde puan uzak olduğunu gösterir. Ayrıntı için öğrencinin adına dokun.</p>
      <div class="scroll"><table class="list an"><thead><tr>
        <th>Öğrenci</th><th>Devamsızlık</th><th>Kaçırdığı derslerin kazanımları</th><th>Katıldığı derslerin kazanımları</th><th>Aynı kazanımlarda derse katılanlar</th><th>Fark (yüzde puan)</th>
      </tr></thead><tbody>
      ${d.per.map(p => {
        const open = AN.open === p.s.id;
        let detail = '';
        if (open) {
          detail = `<tr class="detail"><td colspan="6">${p.missed.length ? `<table class="list"><thead><tr><th>Kaçırdığı derste işlenen kazanım</th><th>İşlendiği ders</th><th>Kaçırdığı</th><th>Başarısı</th><th>Katılanların ortalaması</th></tr></thead><tbody>
            ${p.missed.map(r => `<tr><td>${esc(objLabel(r.objective_id))}</td><td>${r.lessons_taught}</td><td>${r.lessons_missed}</td><td>${pctTxt(r.pct)}</td>
              <td>${r.present_avg == null ? '–' : pctTxt(r.present_avg) + ` <span class="muted">(${r.present_n} öğrenci)</span>`}</td></tr>`).join('')}
            </tbody></table>` : `<p class="muted">Kaçırdığı derslerde işlenip sınavla ölçülen bir kazanım yok.</p>`}</td></tr>`;
        }
        return `<tr class="${open ? 'open' : ''}">
          <td><button type="button" class="link" data-st="${p.s.id}">${esc(p.s.full_name)}</button></td>
          <td>${p.absent} ders${p.late ? `, ${p.late} geç` : ''}</td>
          <td>${pctTxt(p.mMiss)}</td><td>${pctTxt(p.mAtt)}</td><td>${pctTxt(p.mPeers)}</td>
          <td class="${p.gap != null && p.gap < 0 ? 'neg' : ''}">${gapTxt(p.gap)}</td>
        </tr>${detail}`;
      }).join('')}
      </tbody></table></div>
      <p class="muted explain">Bu tablo bir eğilim gösterir, kesin bir sonuç değildir. Kazanım başına soru sayısı azsa tek bir sınav sonucu tabloyu çok etkiler. Devamsızlığın nedeni, örneğin bir hastalık, sonraki haftalardaki başarıyı da etkileyebilir.</p>
    </section>`;
  }
  view().innerHTML = head + body;
  $('#aClass').onchange = e => { AN.classId = e.target.value; AN.courseId = pickCourse(AN.classId, AN.courseId); AN.open = null; loadAnalysis(); };
  $('#aCourse').onchange = e => { AN.courseId = e.target.value; AN.open = null; loadAnalysis(); };
  view().querySelectorAll('[data-st]').forEach(b => {
    b.onclick = () => { AN.open = AN.open === b.dataset.st ? null : b.dataset.st; drawAnalysis(); };
  });
}
