const LANGS = { tr: 'TR', en: 'EN', de: 'DE' };
function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function capFirst(s, lang) { return s ? s.charAt(0).toLocaleUpperCase(lang === 'tr' ? 'tr' : lang) + s.slice(1) : s; }
function fillTpl(tpl, p, lang, subj) { return tpl.replace('{P}', capFirst(p, lang)).replace('{p}', p).replace('{S}', subj); }
function bandOf(l, mx) { return mx <= 1 ? 5 : Math.min(5, Math.max(1, Math.round((l - 1) / (mx - 1) * 4) + 1)); }
function scaleMax(c) { const s = Array.isArray(c.scale) ? c.scale.map(x => Number(x.n)).filter(n => !isNaN(n)) : []; return s.length ? Math.max(...s) : 5; }
// Sınav başarısını rubrik ölçeğine çevirir (5'li ölçekte: %90+ → 5, %70+ → 4, %50+ → 3, %30+ → 2, altı → 1)
function testLevel(pct, mx) { return Math.min(mx, Math.max(1, Math.round(pct * mx))); }

function combinedLevel(CM, sid, oid) {
  const r = CM.scores.get(sid + '|' + oid);
  const t = CM.tests.get(sid + '|' + oid);
  const rl = r != null && r >= 1 ? r : null;
  const tl = t ? testLevel(t.pct, CM.mx) : null;
  if (rl != null && tl != null) return Math.round((rl + tl) / 2);
  return rl != null ? rl : tl;
}

function buildComments(CM) {
  const lang = CM.lang, L = T[lang], mx = CM.mx;
  const c = S.courses.find(x => x.id === CM.courseId) || {};
  const names = c.subject_names && typeof c.subject_names === 'object' ? c.subject_names : {};
  const subj = names[lang] || names.tr || c.subject || '';
  const objs = CM.unit === 'all' ? CM.objs : CM.objs.filter(o => o.unit === CM.unit);
  const sentUse = new Map(), comboUse = new Map(), strUse = new Map(), nxtUse = new Map();
  const inc = (m, k) => m.set(k, (m.get(k) || 0) + 1), get = (m, k) => m.get(k) || 0;
  return CM.students.map(st => {
    const lv = {};
    objs.forEach(o => { const v = combinedLevel(CM, st.id, o.id); if (v != null && v >= 1) lv[o.id] = v; });
    const scored = objs.filter(o => lv[o.id] != null);
    if (!scored.length) return null;
    const vals = scored.map(o => lv[o.id]);
    const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
    const overall = Math.min(mx, Math.max(1, Math.round(avg)));
    const seed = hash(st.full_name), mxv = Math.max(...vals);
    const byUse = (m, salt) => (a, b) => (get(m, a.id) - get(m, b.id)) || ((hash(salt + a.id) ^ seed) - (hash(salt + b.id) ^ seed));
    const strength = scored.filter(o => lv[o.id] === mxv).sort(byUse(strUse, 's'))[0];
    let nextO = null;
    if (scored.length > 1) {
      const others = scored.filter(o => o.id !== strength.id);
      const lo = Math.min(...others.map(o => lv[o.id]));
      nextO = others.filter(o => lv[o.id] === lo).sort(byUse(nxtUse, 'n'))[0];
    }
    inc(strUse, strength.id);
    if (nextO) inc(nxtUse, nextO.id);
    const ob = bandOf(overall, mx), sb2 = bandOf(lv[strength.id], mx);
    const nTarget = nextO || strength, nb = bandOf(lv[nTarget.id], mx);
    const nKey = nextO ? (nb <= 2 ? 'low' : nb === 3 ? 'mid' : nb === 4 ? 'high' : 'top') : (nb >= 5 ? 'top' : nb === 4 ? 'high' : nb === 3 ? 'mid' : 'low');
    const O = L.open[ob], Sx = L.strength[sb2], N = L.next[nKey];
    const ks = `${strength.id}|${sb2}`, kn = `${nTarget.id}|${nKey}`;
    let best = null;
    for (let a = 0; a < O.length; a++) for (let b = 0; b < Sx.length; b++) for (let d = 0; d < N.length; d++) {
      const key = `o${ob}.${a}|${ks}.${b}|${kn}.${d}`;
      const sc = [get(comboUse, key), get(sentUse, `o${ob}.${a}`) + get(sentUse, `s${sb2}.${b}`) + get(sentUse, `n${nKey}.${d}`), (hash(key) ^ seed) >>> 0];
      if (!best || sc[0] < best.sc[0] || (sc[0] === best.sc[0] && (sc[1] < best.sc[1] || (sc[1] === best.sc[1] && sc[2] < best.sc[2])))) best = { a, b, d, key, sc };
    }
    inc(comboUse, best.key); inc(sentUse, `o${ob}.${best.a}`); inc(sentUse, `s${sb2}.${best.b}`); inc(sentUse, `n${nKey}.${best.d}`);
    const ph = o => (o.phrases && o.phrases[lang]) || o.label;
    const note = (CM.notes.get(st.id) || '').trim();
    const parts = { open: fillTpl(O[best.a], '', lang, subj), s: fillTpl(Sx[best.b], ph(strength), lang, subj), n: fillTpl(N[best.d], ph(nTarget), lang, subj), note };
    return { overall, strength: strength.id, next: nextO ? nextO.id : null, parts, text: [parts.open, parts.s, parts.n, parts.note].filter(Boolean).join(' ') };
  });
}

async function viewComments() {
  const cls = yearClasses();
  if (!cls.length || !S.courses.length) {
    view().innerHTML = empty('Yorumlar için önce sınıf listesi ve dersler eklenmeli.');
    return;
  }
  if (!S.CM || !cls.some(c => c.id === S.CM.classId)) {
    const last = restore('cm_' + S.schoolId, {});
    const classId = (cls.find(c => c.id === last.classId) || cls[0]).id;
    S.CM = { classId, courseId: pickCourse(classId, last.courseId), unit: last.unit || 'all', lang: last.lang || 'tr' };
  }
  await loadComments();
}

async function loadComments() {
  const CM = S.CM;
  view().innerHTML = `<p class="muted pad">Yükleniyor…</p>`;
  const course = S.courses.find(c => c.id === CM.courseId);
  if (!course) { view().innerHTML = empty('Bu sınıf için ders bulunamadı.'); return; }
  CM.mx = scaleMax(course);
  CM.objs = await getObjectives(CM.courseId);
  if (CM.unit !== 'all' && !CM.objs.some(o => o.unit === CM.unit)) CM.unit = 'all';
  const st = await sb.from('students').select('id, full_name, school_no').eq('class_id', CM.classId).eq('active', true);
  if (fail(st.error, 'Öğrenciler')) return;
  CM.students = (st.data || []).sort(byNo);
  CM.scores = new Map(); CM.tests = new Map(); CM.notes = new Map();
  const sids = CM.students.map(s => s.id), oids = CM.objs.map(o => o.id);
  if (sids.length && oids.length) {
    const [rs, tp, nt] = await Promise.all([
      fetchAll(() => sb.from('rubric_scores').select('student_id, objective_id, score').in('student_id', sids).in('objective_id', oids)),
      fetchAll(() => sb.from('objective_performance').select('student_id, objective_id, pct, max_total').in('student_id', sids).in('objective_id', oids)),
      sb.from('student_notes').select('student_id, parent_note').eq('course_id', CM.courseId).in('student_id', sids),
    ]);
    if (fail(rs.error, 'Rubrik puanları') || fail(tp.error, 'Sınav sonuçları') || fail(nt.error, 'Notlar')) return;
    rs.data.forEach(r => CM.scores.set(r.student_id + '|' + r.objective_id, Number(r.score)));
    tp.data.forEach(r => CM.tests.set(r.student_id + '|' + r.objective_id, { pct: Number(r.pct), max: Number(r.max_total) }));
    (nt.data || []).forEach(r => CM.notes.set(r.student_id, r.parent_note || ''));
  }
  keep('cm_' + S.schoolId, { classId: CM.classId, courseId: CM.courseId, unit: CM.unit, lang: CM.lang });
  drawComments();
}

function scoreButtons(CM, st, o) {
  const v = CM.scores.get(st.id + '|' + o.id);
  const course = S.courses.find(c => c.id === CM.courseId) || {};
  const scale = (Array.isArray(course.scale) ? course.scale : []).filter(s => Number(s.n) >= 1).sort((a, b) => a.n - b.n);
  const levels = scale.length ? scale : Array.from({ length: CM.mx }, (_, i) => ({ n: i + 1, label: String(i + 1) }));
  const zero = `<button type="button" class="lv zero" data-sid="${st.id}" data-o="${o.id}" data-v="0" aria-pressed="${v === 0}" title="Henüz gözlenmedi" aria-label="${esc(o.label)}: henüz gözlenmedi">–</button>`;
  return zero + levels.map(s => `<button type="button" class="lv l${Math.max(1, Math.min(4, Math.ceil(s.n / CM.mx * 4)))}" data-sid="${st.id}" data-o="${o.id}" data-v="${s.n}" aria-pressed="${v === Number(s.n)}" title="${esc(s.label || '')}" aria-label="${esc(o.label)}: ${s.n}${s.label ? ', ' + esc(s.label) : ''}">${s.n}</button>`).join('');
}

  const ready = results.filter(Boolean).length;
  view().innerHTML = `
  <section class="panel">

    <div class="row"><span class="muted">${CM.students.length} öğrenci, ${ready} hazır yorum</span>
      <button type="button" class="btn small" id="copyAll" ${ready ? '' : 'disabled'}>Tüm yorumları kopyala</button></div>
  </section>

    const res = results[i];
    let left;
    if (CM.unit === 'all') {
      const chips = units.map(u => {
        const v = u.items.map(o => combinedLevel(CM, st.id, o.id)).filter(x => x != null && x >= 1);
        if (!v.length) return '';

        return `<span class="chip l${Math.max(1, Math.min(4, Math.ceil(a / CM.mx * 4)))}">${esc(u.name)}: ${a.toFixed(1).replace('.', ',')}</span>`;
      }).join('');
      left = chips ? `<div class="chips">${chips}</div><p class="muted hint">Puan vermek için yukarıdan bir ünite seç.</p>` : `<p class="muted hint">Henüz puan ya da sınav sonucu yok. Puan vermek için yukarıdan bir ünite seç.</p>`;
    } else {
      left = objs.map(o => {
        const t = CM.tests.get(st.id + '|' + o.id);
        const tag = res ? (o.id === res.strength ? ' tag-s' : o.id === res.next ? ' tag-n' : '') : '';
        return `<div class="obj"><div class="otext${tag}"><b>${esc(o.label)}</b>${t ? `<small>Sınav: %${Math.round(t.pct * 100)} (${fmtNum(t.max)} puanlık soru)</small>` : ''}</div>
          <span class="pick" role="group" aria-label="${esc(o.label)}">${scoreButtons(CM, st, o)}</span></div>`;
      }).join('');
    }
    const comment = res
      ? `<p class="comment" lang="${CM.lang}" data-cm="${st.id}">${esc(res.text)}</p>`
      : `<p class="comment empty">${CM.unit === 'all' ? 'Puan ya da sınav sonucu girildiğinde dönem yorumu burada oluşur.' : 'Bu ünitede bir kazanıma puan verdiğinde ya da sınav sonucu girildiğinde yorum burada oluşur.'}</p>`;
    return `<article class="panel student">

        res.text = [res.parts.open, res.parts.s, res.parts.n, res.parts.note].filter(Boolean).join(' ');
        const p = view().querySelector(`[data-cm="${sid}"]`);
        if (p) p.textContent = res.text;

  });

  };

async function setScore(sid, oid, v) {
  const CM = S.CM, k = sid + '|' + oid;
  const old = CM.scores.get(k);
  if (old === v) {
    CM.scores.delete(k);
    drawComments();
    const { error } = await sb.from('rubric_scores').delete().eq('student_id', sid).eq('objective_id', oid);
    if (fail(error, 'Puan silinemedi')) { CM.scores.set(k, old); drawComments(); }
    return;
  }
  CM.scores.set(k, v);
  drawComments();
  const { error } = await sb.from('rubric_scores').upsert({ student_id: sid, objective_id: oid, school_id: S.schoolId, score: v }, { onConflict: 'student_id,objective_id' });
  if (fail(error, 'Puan kaydedilemedi')) {
    if (old == null) CM.scores.delete(k); else CM.scores.set(k, old);
    drawComments();
  }
}

async function saveNote(sid, text) {
  const { error } = await sb.from('student_notes').upsert({ student_id: sid, course_id: S.CM.courseId, school_id: S.schoolId, parent_note: text }, { onConflict: 'student_id,course_id' });
  fail(error, 'Not kaydedilemedi');
}

       <button type="button" class="btn ghost small" data-remove="${m.user_id}">Okuldan çıkar</button></span>`}</li>`;
}

async function viewSchool() {
  const sc = S.schools.find(s => s.id === S.schoolId) || {};
  const { data: mem, error } = await sb.from('memberships').select('user_id, role, status').eq('school_id', S.schoolId);
  if (fail(error, 'Üyeler')) return;
  const ids = (mem || []).map(m => m.user_id);
  let profs = [];
  if (ids.length) {
    const r = await sb.from('profiles').select('id, full_name, email').in('id', ids);
    profs = r.data || [];
  }
  const P = Object.fromEntries(profs.map(p => [p.id, p]));
  const pending = mem.filter(m => m.status === 'pending');
  const active = mem.filter(m => m.status === 'active');
  view().innerHTML = `
  <section class="panel"><h2>Katılım kodu</h2>
    <p>Öğretmenler hesap açtıktan sonra bu kodu girerek okula katılım ister. Onayladığın öğretmenler okulun verisini görür.</p>
    <div class="row"><span class="code">${esc(sc.join_code || '')}</span><button type="button" class="btn" id="copyCode">Kopyala</button></div>
  </section>
  <section class="panel"><h2>Onay bekleyenler</h2>
    ${pending.length ? `<ul class="members">${pending.map(m => memberRow(m, P[m.user_id], true)).join('')}</ul>` : `<p class="muted">Bekleyen istek yok.</p>`}
  </section>
  <section class="panel"><h2>Okul üyeleri</h2>
    <ul class="members">${active.map(m => memberRow(m, P[m.user_id], false)).join('')}</ul>
  </section>`;

  $('#copyCode').onclick = async () => {
    try { await navigator.clipboard.writeText(sc.join_code || ''); toast('Kod kopyalandı.'); }
    catch (e) { toast('Kopyalanamadı, kodu elle seç.', true); }
  };
  const setMember = async (uid, patch, msg) => {
    const { error: e } = await sb.from('memberships').update(patch).eq('school_id', S.schoolId).eq('user_id', uid);
    if (fail(e, 'Üyelik')) return;
    toast(msg);
    viewSchool();
  };
  view().querySelectorAll('[data-approve]').forEach(b => { b.onclick = () => setMember(b.dataset.approve, { status: 'active' }, 'Öğretmen onaylandı.'); });
  view().querySelectorAll('[data-reject]').forEach(b => { b.onclick = () => setMember(b.dataset.reject, { status: 'removed' }, 'İstek reddedildi.'); });
  view().querySelectorAll('[data-remove]').forEach(b => {
    b.onclick = () => { if (confirm('Bu kişi okuldan çıkarılsın mı?')) setMember(b.dataset.remove, { status: 'removed' }, 'Okuldan çıkarıldı.'); };
  });
  view().querySelectorAll('[data-role]').forEach(s => { s.onchange = () => setMember(s.dataset.role, { role: s.value }, 'Rol güncellendi.'); });
}

// ---------- Hareketsizlikte otomatik çıkış ----------
function markActive() {
  const now = Date.now();
  if (!markActive.last || now - markActive.last > 30000) { markActive.last = now; keep('lastActive', now); }
}
['click', 'keydown', 'touchstart', 'scroll'].forEach(ev => window.addEventListener(ev, markActive, { passive: true }));
function idleExpired() {
  const last = restore('lastActive', null);
  return last && Date.now() - last > IDLE_MINUTES * 60000;
}
setInterval(async () => {
  if (!S.user || !idleExpired()) return;
  keep('lastActive', null);
  await sb.auth.signOut();
  setTimeout(() => renderAuth('login', `${IDLE_MINUTES} dakika işlem yapılmadığı için güvenlik amacıyla çıkış yapıldı.`), 50);
}, 60000);

// ---------- Başlangıç ----------
sb.auth.onAuthStateChange(event => {
  if (event === 'PASSWORD_RECOVERY') setTimeout(() => renderAuth('setpass'), 0);
  if (event === 'SIGNED_OUT') {
    Object.assign(S, { user: null, profile: null, memberships: [], schools: [], schoolId: null, role: null, L: null, X: null, AN: null, CM: null, tab: 'lessons' });
    setTimeout(() => renderAuth('login'), 0);
  }
});

(async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (session && /type=(invite|recovery)/.test(BOOT_HASH)) return renderAuth('setpass');
  if (!session) return renderAuth('login');
  if (idleExpired()) {
    keep('lastActive', null);
    await sb.auth.signOut();
    setTimeout(() => renderAuth('login', `${IDLE_MINUTES} dakika işlem yapılmadığı için güvenlik amacıyla çıkış yapıldı.`), 50);
    return;
  }
  markActive.last = 0;
  markActive();
  await afterLogin(session);
})();
</script>
